name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App (.ipa)
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App
        run: flutter build ios --release --no-codesign

      - name: Package Payload into .ipa
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r -q employee_portal.ipa Payload
          echo "IPA created successfully:"
          ls -lh employee_portal.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: employee_portal_ios_ipa
          path: build/ios/ipa/employee_portal.ipa
          retention-days: 14
